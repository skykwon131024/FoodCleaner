<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>푸드 클리너 - 요리 추천 결과</title>
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>
  <main class="container">
    <div class="page-title-row">
      <div>
        <h1>추천 요리 결과</h1>
        <p class="subtitle">AI가 선택한 재료 기준으로 추천한 메뉴입니다.</p>
      </div>
      <button id="backButton" class="btn" type="button">이전 화면</button>
    </div>

    <section class="card results-panel">
      <h2>사용한 재료</h2>
      <div id="ingredientSummary" class="tag-list"></div>

      <section class="shopping-list-panel" aria-labelledby="shoppingListTitle">
        <div class="shopping-list-header">
          <div>
            <h2 id="shoppingListTitle">장보기 목록</h2>
            <p id="shoppingListCount" class="recipe-meta" aria-live="polite">0개</p>
          </div>
          <button id="clearCompletedShoppingButton" class="btn" type="button" disabled>구매 완료 지우기</button>
        </div>
        <ul id="shoppingListItems" class="shopping-list-items"></ul>
      </section>

      <h2 class="top-gap">추천 요리</h2>
      <div class="recipe-controls">
        <label class="recipe-control" for="utilizationFilter">
          활용률 기준
          <select id="utilizationFilter">
            <option value="0">전체</option>
            <option value="60">60% 이상</option>
            <option value="80">80% 이상</option>
            <option value="100">100%</option>
          </select>
        </label>
        <label class="recipe-control" for="recipeSortSelect">
          정렬
          <select id="recipeSortSelect">
            <option value="utilization">활용률 높은 순</option>
            <option value="time">조리 시간 빠른 순</option>
          </select>
        </label>
      </div>
      <div id="recipeList" class="recipe-list"></div>
    </section>
  </main>

  <script src="recipes.js?v=4"></script>
</body>
</html>
